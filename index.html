<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DEBORA - Portfolio</title>
    <style>
        /* Tipografía Space Grotesk para mantener el estilo geométrico y los ceros tachados */
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&display=swap');

        :root {
            --bg-color: rgba(0, 0, 0, 0.95);
            --text-main: rgba(255, 255, 255, 0.85);
            --text-muted: rgba(132, 132, 132, 0.85);
            --border-color: rgba(255, 255, 255, 0.4);
            --font-main: 'Space Grotesk', Helvetica, Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: var(--font-main);
            text-transform: uppercase;
            font-variant-numeric: slashed-zero;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        a {
            color: inherit;
            text-decoration: none;
            transition: opacity 0.3s ease;
        }

        a:hover {
            opacity: 0.6;
        }

        /* --- NAVEGACIÓN --- */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 2rem 3rem;
            font-size: 1.1rem;
            position: sticky;
            top: 0;
            background-color: var(--bg-color);
            z-index: 100;
        }

        .nav-left, .nav-right {
            display: flex;
            gap: 3rem;
            flex: 1;
        }

        .nav-right {
            justify-content: flex-end;
        }

        .nav-center {
            flex: 1;
            text-align: center;
            font-size: 2rem;
            font-weight: 500;
            letter-spacing: 0.05em;
        }

        /* --- HERO --- */
        .hero {
            text-align: center;
            padding: 8rem 2rem;
        }

        .hero h1 {
            font-size: 3.5rem;
            font-weight: 400;
            line-height: 1.2;
            max-width: 900px;
            margin: 0 auto;
        }

        /* --- CUADRÍCULA DE PROYECTOS --- */
        .projects-container {
            padding: 0 3rem 4rem 3rem;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 4rem 2rem;
            border-top: 1px solid var(--border-color);
            padding-top: 3rem;
        }

        .project-item {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            cursor: pointer;
        }

        .project-title {
            color: var(--text-muted);
            font-size: 0.95rem;
            letter-spacing: 0.02em;
        }

        .project-image {
            width: 100%;
            aspect-ratio: 4 / 5;
            background-color: #111;
            overflow: hidden;
        }

        .project-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: opacity 0.3s ease;
        }

        .project-item:hover .project-image img {
            opacity: 0.7;
        }

        /* --- FOOTER --- */
        footer {
            display: flex;
            justify-content: space-between;
            padding: 2rem 3rem;
            color: var(--text-muted);
            font-size: 1.12rem;
            border-top: 1px solid var(--border-color);
        }

        /* --- RESPONSIVO --- */
        @media (max-width: 1024px) {
            .grid { grid-template-columns: repeat(2, 1fr); }
        }

        @media (max-width: 768px) {
            header { flex-direction: column; gap: 1.5rem; padding: 1.5rem; }
            .nav-left, .nav-right { justify-content: center; gap: 1.5rem; }
            .grid { grid-template-columns: 1fr; }
            .projects-container { padding: 0 1.5rem 2rem 1.5rem; }
            .hero h1 { font-size: 2rem; }
        }
    </style>
</head>
