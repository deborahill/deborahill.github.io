<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="img/logo-dh.png">
    <title>MY OWN BRIEF - Débora Hillert</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600&display=swap');

        :root {
            --bg-color: #000000;
            --text-main: rgba(255, 255, 255, 0.85);
            --text-muted: rgba(132, 132, 132, 0.85);
            --border-color: rgba(255, 255, 255, 0.4);
            --font-main: 'Space Grotesk', Helvetica, Arial, sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: var(--font-main);
            font-variant-numeric: slashed-zero;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        a { color: inherit; text-decoration: none; transition: opacity 0.3s ease; }
        a:hover { opacity: 0.6; }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 2rem 3rem;
            font-size: 0.9rem;
            position: sticky;
            top: 0;
            background-color: var(--bg-color);
            z-index: 100;
        }
        header a { text-transform: uppercase; }
        .nav-left, .nav-right { display: flex; gap: 3rem; flex: 1; }
        .nav-right { justify-content: flex-end; }
        .nav-center { flex: 1; text-align: center; }

        main { flex: 1; padding: 4rem 3rem; }

        .hero { text-align: center; padding: 4rem 2rem 2rem; }
        .hero p {
            font-size: 2.5rem;
            font-weight: 400;
            color: var(--text-main);
            max-width: 1000px;
            margin: 0 auto;
            line-height: 1.1;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 4rem 2rem;
            border-top: 1px solid var(--border-color);
            padding-top: 3rem;
            margin-top: 2rem;
        }

        .project-item { display: flex; flex-direction: column; gap: 1rem; cursor: pointer; }
        .project-title { color: var(--text-muted); font-size: 0.95rem; letter-spacing: 0.02em; text-transform: uppercase; }
        .project-image { width: 100%; overflow: hidden; }
        .project-image img { width: 100%; height: auto; display: block; transition: opacity 0.3s ease; }
        .project-item:hover .project-image img { opacity: 0.7; }

        footer {
            display: flex;
            justify-content: space-between;
            padding: 2rem 3rem;
            color: var(--text-muted);
            font-size: 0.9rem;
            border-top: 1px solid var(--border-color);
        }

        @media (max-width: 1024px) {
            .grid { grid-template-columns: repeat(2, 1fr); }
        }

        @media (max-width: 768px) {
            header { 
                display: flex; justify-content: space-between; 
                padding: 10.5rem 1.25rem 3.5rem 1.25rem; 
                position: relative;
            }
            .nav-left, .nav-right { display: contents; }
            .nav-center { position: absolute; top: 2.5rem; left: 50%; transform: translateX(-50%); width: auto; }
            .nav-center img { height: 75px !important; }
            header a { font-size: 0.75rem; letter-spacing: 0.02em; }
            main { padding: 2rem 1.5rem; }
            .hero p { font-size: 1.5rem; }
            .grid { grid-template-columns: 1fr; gap: 3rem 1.5rem; }
        }
    </style>
</head>
<body>

    <header>
        <div class="nav-left">
            <a href="index.html">WORKS</a>
            <a href="my-own-brief.html">MY OWN BRIEF</a>
        </div>
        <div class="nav-center">
            <a href="index.html">
                <img src="img/logo-dh.png" alt="Debora Hill Logo" style="height: 55px; width: auto;">
            </a>
        </div>
        <div class="nav-right">
            <a href="about.html">ABOUT</a>
            <a href="mailto:deborahillert@gmail.com">CONTACT</a>
        </div>
    </header>

    <main>
        <section class="hero">
            <p>Personal projects and visual explorations.</p>
        </section>

        <!-- Cuadrícula con el proyecto Floral -->
        <section class="grid">
            <a href="proyecto-floral.html" class="project-item">
                <div class="project-title">FLORAL DISTORTION - ART DIRECTION</div>
                <div class="project-image">
                    <img src="img/PROYECTO_17_FLORAL/floral_home.webp" alt="Floral Distortion">
                </div>
            </a>
        </section>
    </main>

    <footer>
        <div>&copy; DEBORA HILLERT</div>
        <div>MADRID, ESPAÑA 2026</div>
    </footer>

</body>
</html>
