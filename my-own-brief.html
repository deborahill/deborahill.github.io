<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MY OWN BRIEF - Débora Hillert</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap');

        :root {
            --bg-color: #000000;
            --text-main: rgba(255, 255, 255, 0.85);
            --text-muted: rgba(132, 132, 132, 0.85);
            --border-color: rgba(255, 255, 255, 0.4);
            --font-main: 'Inter', Helvetica, Arial, sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: var(--font-main);
            font-variant-numeric: slashed-zero;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        a { color: inherit; text-decoration: none; transition: opacity 0.3s ease; }
        a:hover { opacity: 0.6; }

        /* --- NAVEGACIÓN --- */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 2rem 3rem;
            font-size: 0.9rem;
            position: sticky;
            top: 0;
            background-color: var(--bg-color);
            z-index: 100;
        }
        header a { text-transform: uppercase; }
        .nav-left, .nav-right { display: flex; gap: 3rem; flex: 1; }
        .nav-right { justify-content: flex-end; }
        .nav-center { flex: 1; text-align: center; }

        /* --- CONTENEDOR PRINCIPAL --- */
        main {
            flex: 1; /* Esto empuja el footer hacia abajo aunque la página esté vacía */
            padding: 4rem 3rem;
        }

        .hero { text-align: center; padding: 4rem 2rem 2rem; }
        .hero p {
            font-size: 2.5rem;
            font-weight: 400;
            color: var(--text-main);
            max-width: 1000px;
            margin: 0 auto;
            line-height: 1.1;
        }

        .grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 4rem 2rem;
            border-top: 1px solid var(--border-color);
            padding-top: 3rem;
            margin-top: 2rem;
        }

        /* --- FOOTER --- */
        footer {
            display: flex;
            justify-content: space-between;
            padding: 2rem 3rem;
            color: var(--text-muted);
            font-size: 0.9rem;
            border-top: 1px solid var(--border-color);
        }

        /* --- RESPONSIVO --- */
        @media (max-width: 768px) {
            header { flex-direction: column; gap: 1.5rem; padding: 1.5rem; }
            .nav-left, .nav-right { justify-content: center; gap: 1.5rem; }
            main { padding: 2rem 1.5rem; }
            .hero p { font-size: 1.5rem; }
        }
    </style>
</head>
<body>

    <header>
        <div class="nav-left">
            <a href="index.html">WORKS</a>
            <a href="my-own-brief.html">MY OWN BRIEF</a>
        </div>
        <div class="nav-center">
            <a href="index.html">
                <img src="img/logo-dh.png" alt="Debora Hill Logo" style="height: 55px; width: auto;">
            </a>
        </div>
        <div class="nav-right">
            <a href="about.html">ABOUT</a>
            <a href="mailto:deborahillert@gmail.com">CONTACT</a>
        </div>
    </header>

    <main>
        <section class="hero">
            <p>Personal projects and visual explorations.</p>
        </section>

        <!-- Cuadrícula lista para añadir proyectos en el futuro -->
        <section class="grid">
            <!-- Aquí irán los futuros .project-item -->
        </section>
    </main>

    <footer>
        <div>&copy; DEBORA HILLERT</div>
        <div>MADRID, ESPAÑA 2024</div>
    </footer>

</body>
</html>
